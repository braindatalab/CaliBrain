version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  # apt_packages: # Keep if needed for dependencies like POT
  #   - build-essential

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
  - epub
