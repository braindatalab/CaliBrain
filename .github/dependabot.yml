version: 2
updates:
  # Versions of the actions used in .github/workflows. The Python dependencies are not
  # updated automatically: pyproject.toml declares the ranges that users must satisfy,
  # and the tests run against both the newest and the lowest allowed versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
